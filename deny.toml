# cargo-deny policy (run `cargo deny check`). Same policy as the Elbert service monorepo.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Fail on any RustSec advisory; yanked crates are errors too.
yanked = "deny"
ignore = []

[licenses]
# The crate is published under MIT, so only permissive licences are allowed.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# rustls only: the library never links OpenSSL.
deny = [{ crate = "openssl" }, { crate = "openssl-sys" }, { crate = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
